services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: veyrona
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: veyrona
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyrona"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: oven/bun:1-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "bun install && bun run build && bun run start"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://veyrona:${POSTGRES_PASSWORD:-changeme}@db:5432/veyrona
      PORT: "3000"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
